services:
  # FieldQuest PWA Frontend (Nginx Alpine)
  web:
    container_name: fieldquest-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - fieldquest-net

  # FieldQuest Backend API (Node.js 22 Alpine)
  api:
    container_name: fieldquest-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    depends_on:
      - ai-engine
    environment:
      - NODE_ENV=production
      - PORT=4000
      - AI_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ai-engine:11434
      - OLLAMA_MODEL=qwen2.5:3b
      - OLLAMA_TIMEOUT_MS=60000
      - CLIENT_ORIGIN=http://localhost:5173,http://localhost:80,http://127.0.0.1:5173
    restart: unless-stopped
    networks:
      - fieldquest-net

  # Containerized AI Engine (Official Ollama Container) - Enabled by default
  ai-engine:
    container_name: fieldquest-ai
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    networks:
      - fieldquest-net

volumes:
  ollama-models:
    name: fieldquest_ollama_models

networks:
  fieldquest-net:
    driver: bridge
